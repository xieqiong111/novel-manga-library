# Novel & Manga Library web console — generic Docker Compose (Linux hosts).
#
# This service is the BFF + static host in one process:
#   node server/serve.mjs   ->   /api/*  +  web/dist
#
# Studio owns tasks and its library index. The DSH managed mode submits jobs here.
# The image builds both front ends and the Dart engine from the checkout.
# Create the storage paths and the Docker network before starting the service.
# See docs/DEPLOY-NAS.md for the host directory configuration.
#
# Existing Suwayomi / novel only: docker compose -f docker-compose.web.yml up -d web
# Managed Suwayomi: set SUWAYOMI_URL=http://suwayomi:4567, then run
#   docker compose -f docker-compose.web.yml --profile manga up -d
#
# All values can be overridden from .env or the shell. Never commit a real
# token, host name or absolute private path here.
services:
  web:
    build:
      context: .
      target: studio
      args:
        NODE_BASE: "${LN_WEB_IMAGE:-node:24-bookworm-slim}"
        DART_VERSION: "3.13.7"
        DART_CURL_OPTS: "${DART_CURL_OPTS:-}"
        PUB_HOSTED_URL: "${PUB_HOSTED_URL:-https://pub.flutter-io.cn}"
    image: "${LN_STUDIO_WEB_IMAGE:-novel-manga-library-web:local}"
    platform: "${LN_WEB_PLATFORM:-linux/amd64}"
    container_name: "${LN_WEB_CONTAINER_NAME:-lightnovel-studio-web}"
    working_dir: /opt/lightnovel
    user: "${LN_UID:-1001}:${LN_GID:-1001}"
    restart: unless-stopped
    stop_grace_period: 45s

    environment:
      LN_BFF_HOST: 0.0.0.0
      LN_BFF_PORT: 8080
      LN_WEB_DIST: /opt/lightnovel/web/dist
      LN_BFF_DATA_DIR: /data
      LN_NOVEL_STORAGE_ROOT: /storage/novel
      LN_MANGA_STORAGE_ROOT: /storage/manga
      LN_NOVEL_STORAGE_LABEL: "${LN_NOVEL_STORAGE_HOST:-./data/novel-downloads}"
      LN_MANGA_STORAGE_LABEL: "${LN_MANGA_STORAGE_HOST:-./data/manga-downloads}"
      LN_DOWNLOAD_FOLDERS_FILE: /storage-settings/download-folders.json
      LN_BFF_LIBRARY_DIR: /data/library
      LN_FIXTURES_DIR: /opt/lightnovel/test/fixtures
      LN_DART_BINARY: /opt/bnp/bnp_headless
      LN_DART_PROJECT_DIR: /opt/lightnovel/vendor/bili_novel_packer
      # Optional token for scripts. Browser access uses accounts by default.
      LN_BFF_TOKEN: "${LN_BFF_TOKEN:-}"
      LN_STUDIO_ACCOUNTS: "${LN_STUDIO_ACCOUNTS:-true}"
      LN_STUDIO_SETUP_CODE: "${LN_STUDIO_SETUP_CODE:-}"
      LN_STUDIO_SECURE_COOKIE: "${LN_STUDIO_SECURE_COOKIE:-false}"
      LN_STUDIO_WEB_ORIGIN: "${LN_STUDIO_WEB_ORIGIN:-}"
      LN_STUDIO_JOB_TOKEN_FILE: "${LN_STUDIO_JOB_TOKEN_FILE:-}"
      LN_STUDIO_NOVEL_TASK_HISTORY_DIR: "${LN_STUDIO_NOVEL_TASK_HISTORY_DIR:-}"
      # Destructive DELETE /api/library/:id stays off unless explicitly opted in.
      LN_BFF_ALLOW_DELETE: "${LN_BFF_ALLOW_DELETE:-false}"
      LN_BFF_CORS_ORIGIN: "${LN_BFF_CORS_ORIGIN:-}"
      LN_ENABLED_SOURCES: "${LN_ENABLED_SOURCES:-bilinovel,fixture}"
      LN_OFFLINE_ONLY: "${LN_OFFLINE_ONLY:-false}"
      LN_RESPECT_ROBOTS: "${LN_RESPECT_ROBOTS:-true}"
      LN_REQUEST_INTERVAL_MS: "${LN_REQUEST_INTERVAL_MS:-4000}"
      LN_MAX_CONCURRENT_DOWNLOADS: "${LN_MAX_CONCURRENT_DOWNLOADS:-1}"
      LN_LOG_LEVEL: "${LN_LOG_LEVEL:-info}"
      SUWAYOMI_URL: "${LN_SUWAYOMI_URL:-${SUWAYOMI_URL:-}}"
      SUWAYOMI_USERNAME: "${LN_SUWAYOMI_USERNAME:-${SUWAYOMI_USERNAME:-}}"
      SUWAYOMI_PASSWORD: "${LN_SUWAYOMI_PASSWORD:-${SUWAYOMI_PASSWORD:-}}"
      SUWAYOMI_TIMEOUT_MS: "${LN_SUWAYOMI_TIMEOUT_MS:-${SUWAYOMI_TIMEOUT_MS:-8000}}"
      LN_OPENTOME_SQLITE: "${LN_OPENTOME_SQLITE:-}"
      LN_VOLUME_ARCHIVE_URL: "${LN_VOLUME_ARCHIVE_URL:-}"
      SUWAYOMI_TITLE_ALIASES: "${SUWAYOMI_TITLE_ALIASES:-}"
      LN_KOMGA_ALLOWED_URLS: "${LN_KOMGA_ALLOWED_URLS:-}"
      LN_KOMGA_URL: "${LN_KOMGA_URL:-}"
      LN_KOMGA_API_KEY: "${LN_KOMGA_API_KEY:-}"
      LN_KOMGA_USERNAME: "${LN_KOMGA_USERNAME:-}"
      LN_KOMGA_PASSWORD: "${LN_KOMGA_PASSWORD:-}"
      BANGUMI_ACCESS_TOKEN: "${BANGUMI_ACCESS_TOKEN:-}"
      BANGUMI_ARCHIVE_DIR: "${BANGUMI_ARCHIVE_DIR:-}"
      LN_STUDIO_METADATA_TOKEN_FILE: "${LN_STUDIO_METADATA_TOKEN_FILE:-}"
      LN_KOMGA_TIMEOUT_MS: "${LN_KOMGA_TIMEOUT_MS:-8000}"

    ports:
      - "${LN_STUDIO_PORT:-${LN_WEB_PORT:-5273}}:8080"

    volumes:
      # Mutable state: library EPUBs, task records, logs and the local index.
      - "${LN_STUDIO_DATA_DIR:-${LN_DATA_DIR:-./data}}:/data"
      - "${LN_NOVEL_STORAGE_HOST:-./data/novel-downloads}:/storage/novel"
      - "${LN_MANGA_STORAGE_HOST:-./data/manga-downloads}:/storage/manga"
      - "${LN_DOWNLOAD_SETTINGS_HOST:-./data/download-settings}:/storage-settings"
    healthcheck:
      # The auth status endpoint is available before the account is created.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:8080/api/auth/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - default

  suwayomi:
    profiles: ["manga"]
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2366
    platform: linux/amd64
    restart: unless-stopped
    environment:
      AUTH_MODE: "${SUWAYOMI_AUTH_MODE:-none}"
      AUTH_USERNAME: "${LN_SUWAYOMI_USERNAME:-${SUWAYOMI_USERNAME:-}}"
      AUTH_PASSWORD: "${LN_SUWAYOMI_PASSWORD:-${SUWAYOMI_PASSWORD:-}}"
    ports:
      # Optional admin access from the host. Studio uses the internal service name.
      - "${SUWAYOMI_ADMIN_BIND:-127.0.0.1}:${SUWAYOMI_ADMIN_PORT:-4567}:4567"
    volumes:
      - suwayomi-downloads:/home/suwayomi/.local/share/Tachidesk/downloads
      - suwayomi-data:/home/suwayomi/.local/share/Tachidesk
    networks:
      - default

volumes:
  suwayomi-data:
  suwayomi-downloads:

networks:
  default:
    # Reuse an existing network to avoid exhausting Docker's address pools
    # on NAS installations that already run many stacks.
    external: true
    name: "${LN_WEB_NETWORK:-dsh-lightnovel-net}"
